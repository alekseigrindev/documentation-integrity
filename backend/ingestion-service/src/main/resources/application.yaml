server:
  port: 27394

spring:
  application:
    name: documentation-integrity-ingestion

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  flyway:
    schemas: knowledge
    default-schema: knowledge
    create-schemas: true

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  servlet:
    multipart:
      max-file-size: ${DOCUMENTATION_MULTIPART_MAX_FILE_SIZE:1MB}
      max-request-size: ${DOCUMENTATION_MULTIPART_MAX_REQUEST_SIZE:2MB}

documentation-integrity:
  import:
    checkout-root: ${DOCUMENTATION_CHECKOUT_ROOT}
    max-file-bytes: ${DOCUMENTATION_MAX_FILE_BYTES:1048576}

  embedding:
    enabled: ${DOCUMENTATION_EMBEDDING_ENABLED:false}
    model-path: ${DOCUMENTATION_EMBEDDING_MODEL_PATH:}
    tokenizer-path: ${DOCUMENTATION_EMBEDDING_TOKENIZER_PATH:}
    max-tokens: ${DOCUMENTATION_EMBEDDING_MAX_TOKENS:512}
    batch-size: ${DOCUMENTATION_EMBEDDING_BATCH_SIZE:1}

  reranker:
    enabled: ${DOCUMENTATION_RERANKER_ENABLED:false}
    model-path: ${DOCUMENTATION_RERANKER_MODEL_PATH:}
    tokenizer-path: ${DOCUMENTATION_RERANKER_TOKENIZER_PATH:}
    max-tokens: ${DOCUMENTATION_RERANKER_MAX_TOKENS:}
    batch-size: ${DOCUMENTATION_RERANKER_BATCH_SIZE:}
